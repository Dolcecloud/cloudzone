<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CloudZone — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
  </head>
  <body class="bg-dark text-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">CloudZone Admin</a>
        <div>
          <a class="btn btn-sm btn-outline-light" href="index.html">Open Site</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="h4 mb-0">Connected Users</h2>
          <small class="text-muted">Manage currently connected clients</small>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="badge bg-success text-dark py-2 px-3" id="visitCount">Visits: 0</div>
          <button id="btnRefresh" class="btn btn-sm btn-primary">Refresh</button>
        </div>
      </div>

      <div class="table-responsive bg-secondary bg-opacity-10 p-3 rounded mb-3">
        <table class="table table-dark table-striped align-middle mb-0" id="usersTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Device</th>
              <th>Connected At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- rows inserted by admin.js -->
          </tbody>
        </table>
      </div>

      <div class="card bg-secondary bg-opacity-10 p-3 rounded mt-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h3 class="h6 mb-0">Visit Logs</h3>
          <button id="btnRefreshVisits" class="btn btn-sm btn-outline-light">Refresh Visits</button>
        </div>
        <div class="table-responsive">
          <table class="table table-dark table-striped align-middle mb-0" id="visitsTable">
            <thead>
              <tr><th>#</th><th>Timestamp</th><th>IP</th><th>User-Agent</th></tr>
            </thead>
            <tbody>
              <tr><td colspan="4">No visits yet.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
